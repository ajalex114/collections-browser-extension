name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build store upload package
        run: npm run package
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Check packaged extension in Chromium
        run: npm run test:browser
      - name: Upload store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collection-store-package
          path: release/*.zip
          if-no-files-found: error
